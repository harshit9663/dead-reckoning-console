<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autonomous Navigation Console</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; }
    
    /* Top Bar */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0; height: 50px;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      z-index: 1000; display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .title-box h1 { font-size: 13px; font-weight: 700; color: #38bdf8; }
    .title-box p { font-size: 10px; color: #94a3b8; }
    .status-badge {
      font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 600;
      background: #065f46; color: #34d399; border: 1px solid #059669;
    }

    /* Map container */
    #map { width: 100%; height: 100%; z-index: 1; }

    /* Bottom Floating Drawer for Mobile */
    #bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.15); border-radius: 16px 16px 0 0;
      padding: 12px; z-index: 1000; max-height: 40vh; overflow-y: auto;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }
    .panel-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .metric-card {
      background: rgba(30, 41, 59, 0.7); padding: 8px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .metric-card label { font-size: 10px; color: #94a3b8; display: block; text-transform: uppercase; }
    .metric-card span { font-size: 13px; font-weight: 600; color: #f8fafc; }
    
    .btn-action {
      width: 100%; margin-top: 10px; padding: 10px; font-size: 12px; font-weight: 600;
      border-radius: 8px; border: none; background: #dc2626; color: white; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="title-box">
      <h1>Autonomous Navigation</h1>
      <p>Hybrid GNSS & AI Dead Reckoning</p>
    </div>
    <div id="statusBadge" class="status-badge">LOCKING SATELLITES...</div>
  </div>

  <div id="map"></div>

  <div id="bottom-panel">
    <div class="panel-grid">
      <div class="metric-card">
        <label>Nav Source</label>
        <span id="navSource" style="color: #38bdf8;">GNSS (Live)</span>
      </div>
      <div class="metric-card">
        <label>Drift Error</label>
        <span id="driftError">0.00 m</span>
      </div>
      <div class="metric-card">
        <label>Corrected Heading</label>
        <span id="headingVal">0.00°</span>
      </div>
      <div class="metric-card">
        <label>AI Bias Filter</label>
        <span id="biasVal">0.000</span>
      </div>
    </div>
    <button id="toggleGpsBtn" class="btn-action" onclick="toggleGPS()">Simulate GPS Loss</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = L.map('map', { zoomControl: false }).setView([25.18, 75.83], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let vehicleMarker = L.circleMarker([25.18, 75.83], {
      radius: 9, fillColor: '#38bdf8', color: '#fff', weight: 2, fillOpacity: 1
    }).addTo(map);

    let gpsActive = true;
    let currentLat = 25.18, currentLon = 75.83;

    function toggleGPS() {
      gpsActive = !gpsActive;
      const btn = document.getElementById("toggleGpsBtn");
      const badge = document.getElementById("statusBadge");
      const src = document.getElementById("navSource");

      if (!gpsActive) {
        btn.innerText = "Restore GNSS Lock";
        btn.style.background = "#059669";
        badge.innerText = "GPS DENIED | AI DRIVING";
        badge.style.background = "#7f1d1d";
        badge.style.color = "#fca5a5";
        src.innerText = "Dead Reckoning";
        src.style.color = "#f87171";
      } else {
        btn.innerText = "Simulate GPS Loss";
        btn.style.background = "#dc2626";
        badge.innerText = "GNSS LOCKED";
        badge.style.background = "#065f46";
        badge.style.color = "#34d399";
        src.innerText = "GNSS (Live)";
        src.style.color = "#38bdf8";
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((pos) => {
        if (gpsActive) {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          vehicleMarker.setLatLng([currentLat, currentLon]);
          map.panTo([currentLat, currentLon]);
          document.getElementById("statusBadge").innerText = "GNSS LOCKED";
        }
      }, (err) => console.warn(err), { enableHighAccuracy: true });
    }

    setInterval(() => {
      fetch("/process-telemetry", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          lat: currentLat, lon: currentLon, gyro: 0.05, gps_valid: gpsActive
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          document.getElementById("driftError").innerText = data.drift_error_meters + " m";
          document.getElementById("biasVal").innerText = data.predicted_bias;
          if (!gpsActive) {
            currentLat = data.ai_lat;
            currentLon = data.ai_lon;
            vehicleMarker.setLatLng([currentLat, currentLon]);
            map.panTo([currentLat, currentLon]);
          }
        }
      }).catch(e => console.error(e));
    }, 1000);
  </script>
</body>
</html>
