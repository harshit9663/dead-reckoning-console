<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Autonomous Navigation Console</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #fff; }

    /* Top Bar */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0; height: 56px;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px);
      z-index: 1000; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .title-box h1 { font-size: 14px; font-weight: 700; color: #38bdf8; }
    .title-box p { font-size: 10px; color: #94a3b8; }
    .status-badge {
      font-size: 10px; padding: 5px 9px; border-radius: 6px; font-weight: 700;
      background: #065f46; color: #34d399; border: 1px solid #059669;
      text-transform: uppercase;
    }

    /* Map */
    #map { width: 100%; height: 100%; z-index: 1; }

    /* Bottom Floating Drawer for Mobile */
    #bottom-panel {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.15); border-radius: 18px 18px 0 0;
      padding: 14px; z-index: 1000; box-shadow: 0 -4px 25px rgba(0,0,0,0.6);
    }
    .panel-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 10px;
    }
    .metric-card {
      background: rgba(30, 41, 59, 0.75); padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .metric-card label { font-size: 10px; color: #94a3b8; display: block; text-transform: uppercase; margin-bottom: 2px; }
    .metric-card span { font-size: 13px; font-weight: 700; color: #f8fafc; }
    
    .status-indicator {
      display: inline-flex; align-items: center; gap: 6px;
    }
    .led-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #f87171;
      box-shadow: 0 0 8px rgba(248, 113, 113, 0.6);
    }
    .led-dot.online {
      background: #34d399;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
    }

    .btn-action {
      width: 100%; padding: 11px; font-size: 12px; font-weight: 700;
      border-radius: 8px; border: none; background: #ef4444; color: white; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="title-box">
      <h1>Autonomous Navigation</h1>
      <p>Hybrid GNSS & AI Dead Reckoning</p>
    </div>
    <div id="statusBadge" class="status-badge">LOCKING GPS...</div>
  </div>

  <div id="map"></div>

  <div id="bottom-panel">
    <div class="panel-grid">
      <div class="metric-card">
        <label>Backend State</label>
        <div class="status-indicator">
          <div id="backendLed" class="led-dot"></div>
          <span id="backendStatus" style="color: #f87171;">Connecting...</span>
        </div>
      </div>
      <div class="metric-card">
        <label>Nav Mode</label>
        <span id="navSource" style="color: #38bdf8;">GNSS (Live)</span>
      </div>
      <div class="metric-card">
        <label>Drift Noise</label>
        <span id="driftError">0.00 m</span>
      </div>
      <div class="metric-card">
        <label>AI Bias Drift</label>
        <span id="biasVal">0.0000</span>
      </div>
    </div>
    <button id="toggleGpsBtn" class="btn-action" onclick="toggleGPS()">Simulate GPS Loss</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map = L.map('map', { zoomControl: false }).setView([25.18, 75.83], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let vehicleMarker = L.circleMarker([25.18, 75.83], {
      radius: 9, fillColor: '#38bdf8', color: '#fff', weight: 2.5, fillOpacity: 1
    }).addTo(map);

    let gpsActive = true;
    let currentLat = 25.18, currentLon = 75.83;

    function toggleGPS() {
      gpsActive = !gpsActive;
      const btn = document.getElementById("toggleGpsBtn");
      const badge = document.getElementById("statusBadge");
      const src = document.getElementById("navSource");

      if (!gpsActive) {
        btn.innerText = "Restore GNSS Lock";
        btn.style.background = "#059669";
        badge.innerText = "GPS DENIED | AI DRIVING";
        badge.style.background = "#7f1d1d";
        badge.style.color = "#fca5a5";
        src.innerText = "Dead Reckoning";
        src.style.color = "#f87171";
      } else {
        btn.innerText = "Simulate GPS Loss";
        btn.style.background = "#ef4444";
        badge.innerText = "GNSS LOCKED";
        badge.style.background = "#065f46";
        badge.style.color = "#34d399";
        src.innerText = "GNSS (Live)";
        src.style.color = "#38bdf8";
      }
    }

    // Geolocation lock
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((pos) => {
        if (gpsActive) {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          vehicleMarker.setLatLng([currentLat, currentLon]);
          map.panTo([currentLat, currentLon]);
          document.getElementById("statusBadge").innerText = "GNSS LOCKED";
        }
      }, (err) => {
        console.warn(err);
        document.getElementById("statusBadge").innerText = "GPS STANDBY";
      }, { enableHighAccuracy: true });
    }

    // Backend loop with dynamic URL path
    const endpoint = window.location.origin + "/process-telemetry";

    function syncTelemetry() {
      fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          lat: currentLat,
          lon: currentLon,
          gyro: 0.05,
          gps_valid: gpsActive
        })
      })
      .then(res => {
        if (!res.ok) throw new Error("HTTP Status " + res.status);
        return res.json();
      })
      .then(data => {
        if (data.status === "success") {
          // Green online LED
          const led = document.getElementById("backendLed");
          const statusText = document.getElementById("backendStatus");
          led.classList.add("online");
          statusText.innerText = "Connected";
          statusText.style.color = "#34d399";

          // Telemetry readings
          document.getElementById("driftError").innerText = data.drift_error_meters + " m";
          document.getElementById("biasVal").innerText = data.predicted_bias;

          // AI Dead Reckoning prediction updates if GPS is off
          if (!gpsActive) {
            currentLat = data.ai_lat;
            currentLon = data.ai_lon;
            vehicleMarker.setLatLng([currentLat, currentLon]);
            map.panTo([currentLat, currentLon]);
          }
        }
      })
      .catch(err => {
        const led = document.getElementById("backendLed");
        const statusText = document.getElementById("backendStatus");
        led.classList.remove("online");
        statusText.innerText = "Reconnecting...";
        statusText.style.color = "#f87171";
      });
    }

    // Run every 1 second
    setInterval(syncTelemetry, 1000);
    syncTelemetry();
  </script>
</body>
</html>
